name: Refresh trial list

on:
  schedule:
    # Monday 15:00 UTC. 11:00 AM US Eastern. After the Sunday paper-link job.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldwide-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the trial list from current sources
        run: python build.py --refresh

      - name: Commit new trials
        run: |
          files=()
          for f in data/trials.json docs/index.html data/acceptance.md; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No trial-list files"
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No trial-list changes"
          else
            git -c user.name="worldwide-rt-refresh" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh trial list $(date -u +%F)"
            git pull --rebase --no-autostash
            git push
          fi
